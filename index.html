<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест на внимательность: найди отличие</title>
    <style>
        /* Оформление обычной страницы-обманки */
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: pointer; /* Делает курсор в виде пальца, призывая кликнуть */
        }
        .box {
            text-align: center;
        }
        .fake-pic {
            width: 600px;
            height: 400px;
            background-color: #ccc;
            border: 4px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #444;
        }

        /* Стиль для скримера — изначально полностью скрыт (display: none) */
        #screamer-screen {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: black;
            z-index: 99999; /* Поверх вообще всех элементов */
        }
        #screamer-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает картинку на весь экран без искажений */
        }
    </style>
</head>
<body>

    <!-- Это видит жертва, когда заходит на сайт -->
    <div class="box">
        <h1>Найди 3 отличия между картинками</h1>
        <p>Внимательно всмотрись в изображение и кликни на место отличия:</p>
        <div class="fake-pic">
            [ КАРТИНКА ЗАГРУЖАЕТСЯ, КЛИКНИ ДЛЯ ОТПРАВКИ ОТВЕТА ]
        </div>
    </div>

    <!-- Это блок самого скримера, он не виден, пока не сработает скрипт -->
    <div id="screamer-screen">
        <img src="scary-face.jpg" alt="BOO!">
    </div>

    <!-- Скрытый плеер для звука крика -->
    <audio id="scream-audio" src="scream.mp3" preload="auto"></audio>
    <script>
        // Функция, которая резко включает скример
        function BOO() {
            // 1. Находим блок скримера и делаем его видимым
            document.getElementById('screamer-screen').style.display = 'block';
            
            // 2. Находим звук, выкручиваем громкость на максимум и запускаем
            const sound = document.getElementById('scream-audio');
            sound.volume = 1.0; 
            sound.play();

            // 3. Магия: разворачиваем браузер на весь экран, чтобы скрыть вкладки
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }

        // Ждем, пока пользователь кликнет в любое место сайта
        document.body.addEventListener('click', () => {
            // Как только клик произошел, запускаем функцию BOO через 3000 миллисекунд (3 секунды)
            setTimeout(BOO, 3000);
        });
    </script>

</body>
</html>
